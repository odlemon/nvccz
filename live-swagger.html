      <script>
        window.onload = function() {
          const ui = SwaggerUIBundle({
            spec: {"openapi":"3.0.0","info":{"title":"NVCCZ API Documentation","version":"1.0.0","description":"A comprehensive API for managing users, roles, and permissions with role-based access control.","contact":{"name":"API Support","email":"support@niakazi.com"},"license":{"name":"ISC","url":"https://opensource.org/licenses/ISC"}},"servers":[{"url":"https://nvccz-pi.vercel.app/api","description":"Production API base (paths are /accounting/..., /auth/..., etc.)"},{"url":"http://localhost:3000/api","description":"Development API base"}],"tags":[{"name":"Capital Calls (LP drawdowns)","description":"**Start here:** add the LP (**`POST /clients`** — full URL with default server: `/api/clients`) and fund **investment commitment** (same call or **`PUT /clients/{id}`**). Then **`/funds/.../capital-calls`**: list/initiate (**Dr 1210 / Cr 3010**), **lp-summary**, detail, **GET …/notice**, **send-notices** (HTML + **PDF**), **GET/POST …/payments**. **Docs:** **`docs/capital-calls-lp-drawdowns.md`**. **DB:** **`npm run db:migrate:capital-calls`**, **`npm run db:migrate:capital-call-allocation-payments`**, **`npm run db:ensure:capital-call-accounts`**. **IDs:** **`npm run db:print:capital-call-postman`**."},{"name":"LP Fees & Distributions","description":"Fund operations for **limited partners (LPs)**: configure economics, **bill management fees** (money in from LPs), and **declare distributions** (money out to LPs after carry). Base path: **`/api/funds/{fundId}/...`** (Swagger server URL already includes `/api`).\n\n---\n\n### Prerequisites (before any call)\n- LPs exist as **Clients** with **ACTIVE** or **PENDING** **investment commitments** on this fund.\n- All commitments use the **same currency**.\n- **Capital calls** (drawdowns) are a separate module; paid-in amounts affect distribution splits.\n\n---\n\n### Suggested UI structure (two tabs per fund)\n\n**Tab A — Management fees**\n| Step | Endpoint | Screen |\n|------|----------|--------|\n| Setup | 1–2 `fee-policy` | Fund settings: annual fee %, base (committed/invested/NAV), carry/hurdle |\n| List | 3 `GET management-fees` | Table of billing periods + status badges |\n| Create | 4 `POST management-fees` | Modal: period dates → accrue |\n| Detail | 5 `GET …/{periodId}` | Header totals + LP table (`shareOfFee`, `amountPaid`, status) |\n| Notify | 6 `POST …/send-invoices` | Button (re-sends if clicked again) |\n| Collect | 7 `POST …/payments` | Per-LP “Record payment” + bank account picker |\n\n**Tab B — Distributions**\n| Step | Endpoint | Screen |\n|------|----------|--------|\n| List | 8 `GET distributions` | Table: date, source, gross, carry, net, status |\n| Create | 9 `POST distributions` | Modal: gross amount, source, optional portfolio links |\n| Detail | 10 `GET …/{distributionId}` | Waterfall summary + LP payout table |\n| Notify | 11 `POST …/send-notices` | Email LPs |\n| Pay out | 12 `POST …/payouts` | Per-LP outbound payment |\n\n---\n\n### Status workflows (for badges)\n**Management fee period:** `ACCRUED` → `INVOICED` → `PARTIALLY_PAID` → `PAID` (also `statusLabel` on each row).\n**Per-LP fee line:** `PENDING` → `PARTIALLY_PAID` → `PAID`.\n**Distribution:** `DECLARED` → `NOTICES_SENT` → `PARTIALLY_PAID` → `PAID`.\n\n---\n\n### Frontend conventions\n- Rates in JSON are **fractions** (`0.02` = 2%) — multiply by 100 for display.\n- Amounts are **strings** in list/detail (decimal precision) — parse for math.\n- Save **`data.id`** after create (accrue/declare) for detail routes.\n- Use **`data.allocations[].id`** as `allocationId` in payment/payout URLs.\n- **`cashChartOfAccountId`**: pass bank COA id from your chart-of-accounts picker (recommended).\n- Responses: `{ success, message?, data }` — show `message` on errors only (user-facing text).\n\nEach operation below has a **detailed description** (purpose, request fields, response usage, errors)."},{"name":"Fund Management","description":"Create and configure **funds** (`totalAmount`, `remainingAmount`, **`minInvestment` / `maxInvestment`** per LP ticket, windows, status). **Admin** for create/update/close; **admin** or **fund_manager** for list/get/statistics. Paths are under **`/funds`** (server base URL already includes `/api`). Capital-call routes under `/funds/{fundId}/capital-calls` are documented under **Capital Calls (LP drawdowns)**."},{"name":"Company Profile","description":"Company letterhead profile, addresses (one active at a time), and logo upload"},{"name":"Portfolio Letterheads","description":"Investee letterhead CRUD per portfolio company — legal name, address lines, contact, social links, logo (`GET/PUT/DELETE /portfolio-companies/{id}/letterhead`, `POST …/letterhead/logo`). Authenticated users only; not tied to a specific financial report."},{"name":"Payroll - Employees","description":"Payroll roster — create/list/update employees. **`POST /payroll/employees`** and **`PUT /payroll/employees/{id}`** use **`multipart/form-data`**: upload profile photo as field **`picture`** (remote storage, same as portfolio letterhead logos) or optional text **`pictureUrl`** for a pre-hosted URL."},{"name":"Portfolio Monitoring & Exit Management","description":"**§2.4 Portfolio monitoring:** periodic **valuation events** and **exit management** per investment. Base path **`/investments/{investmentImplementationId}`** (server URL already includes `/api`). Resolve `investmentImplementationId` via `GET /investment-implementations/{portfolioCompanyId}` → `data.id`. Roles: admin, fund_manager, ceo, cfo. See **`docs/portfolio-monitoring-valuation-and-exit.md`**. DB: **`npm run db:migrate:investment-valuation-exit`**."},{"name":"VAT Rates","description":"Manage VAT rates — only one can be active at a time. The active rate is used by all accounting services for VAT calculations."},{"name":"Accounting - Period lock","description":"End-to-end period locking: **legacy cashbook** (`/cashbook/periods/...`) and **fiscal calendar** (`/accounting/fiscal-calendar/...`) — month status, lock/unlock, validate date, module draft/commit, policy, audit, posting exceptions. Production Swagger groups all these operations under this tag."},{"name":"Financial Reporting","description":"Portfolio financial reports and automation. Endpoint descriptions state **Audience:** **Applicant (investee)** vs **Investor (fund staff)**. Covers investor calendar (opened periods), mandatory-attachment catalog, **reporting schedule config** CRUD (`reporting_schedule_configs`, investor JWT), manual nudge, and (where documented) reminder cron helpers. **Schedule-tick** automation endpoints are intentionally omitted from this spec. `/applicant/*` routes are investee; `/portfolio-companies/*` reporting routes are typically investor."},{"name":"Investee Reporting","description":"**Audience:** Applicant (investee) only. Reporting flow: list open requests, upload statement XLSX/PDFs, attach files, submit a reporting period for review, download templates, update draft line items, and save period KPIs."},{"name":"Accounts Payables","description":"Purchase invoice management for non-procurement expenses - Create, submit, and pay invoices with BANK, CASH, or CREDIT payment methods"},{"name":"Procurement - Requisitions","description":"Purchase requisition management - Create, view, submit, and approve requisitions"},{"name":"Procurement - RFQ","description":"Request for Quote - Create and send RFQs to multiple vendors"},{"name":"Procurement - Vendor Quotations","description":"Vendor quotation management - Submit (public), view, accept, reject quotations"},{"name":"Procurement - Purchase Orders","description":"Purchase order management - Create, send, and manage purchase orders"},{"name":"Procurement - GRN","description":"Goods Received Note - Record received quantities and quality status"},{"name":"Procurement - Invoices","description":"Procurement invoice management - Create, OCR processing, AI matching, and approve invoices"},{"name":"Procurement - Payments","description":"Payment processing - Process payments and create accounting entries"},{"name":"Procurement - Dashboard","description":"Procurement dashboard - Get summary statistics and overview data"},{"name":"Procurement — UAT","description":"Umbrella tag that groups **Procurement UAT** flows across Suites 01–06 (vendor self-registration + KYC, investee drawdown PR workflow, RFQ/bidding, PO sign-off, GRN/QC, and Suite 06 invoice intake + 3-way match). See **`docs/procurement-uat.md`** for Postman order, request body examples, and acceptance notes."},{"name":"Vendor Master, Compliance & KYC (Suite 01)","description":"Suite 01: Vendor master data, self-registration and KYC upload (token), staff approval, blacklist / RFQ eligibility, and related accounting vendor APIs where tagged."},{"name":"Procurement — RFQ & Bidding (Suite 03)","description":"Suite 03: Formal RFQs (procurement_rfqs), sealed bid viewing until closing, comparison matrix with FX normalization, award + regret emails, deadline extension, clarifications, public tender listing."},{"name":"Procurement — PO & Sign-off (Suite 04)","description":"Suite 04: PO investee/fund tagging, amount-threshold approvals, PDF with verification placeholder, dispatch/ack tokens, line cancel, GRN return-to-vendor stub."},{"name":"Procurement — GRN & QC (Suite 05)","description":"Suite 05: Goods receipt with over-delivery tolerance, attachments/geo, investee GRN path, partial PO status, RTV records."},{"name":"Procurement — AI invoice intake (Suite 06)","description":"Suite 06: Vendor invoice PDF URL intake, text extraction, configurable OpenAI-compatible LLM parse, per-vendor correction map, human verification queue."},{"name":"Procurement — 3-way match (Suite 06)","description":"Suite 06: Deterministic PO vs GRN vs vendor bill line match; price variance and quantity vs GRN; payment blocked when DISPUTED."},{"name":"Procurement — Match dashboard (Suite 06)","description":"Suite 06: CFO-oriented counts — matched bills, disputed bills, intakes pending verification."},{"name":"Investee Portal — Investment Drawdown","description":"Suite 02: Investee purchase requisitions against held investment tranche, VC CFO executive gate, auto-RQFs, fund-scoped visibility, SLA alerts, and applicant portal drawdown APIs."},{"name":"Applicant Portal","description":"Investee / portfolio company applicant APIs (profile, application, Suite 02 procurement when tagged)."},{"name":"Procurement - Approval Configuration","description":"Approval configuration management - Create and manage approval workflows (SINGLE CONFIG SYSTEM). Also includes approval request endpoints for approvers."},{"name":"Events — Core & calendar (EventSync)","description":"EventSync UAT: listings, create/update/delete, public event pages, upcoming; Google Calendar sync when configured. See docs/events-uat.md."},{"name":"Events — Guests & RSVP (EventSync)","description":"EventSync UAT: guest list, invitations, public RSVP by token, check-in. See docs/events-uat.md."},{"name":"Events — Budget & approval (EventSync)","description":"EventSync UAT: budget line items and internal budget approval (not Procurement PR in current build). See docs/events-uat.md."},{"name":"Events — Expenses & accounting (EventSync)","description":"EventSync UAT: record event expenses; journal entries via accounting services. See docs/events-uat.md."},{"name":"Events — Feedback (EventSync)","description":"EventSync UAT: public feedback submit and staff feedback list. See docs/events-uat.md."},{"name":"Events — Analytics & reports (EventSync)","description":"EventSync UAT: event analytics and generated reports (EventReport). See docs/events-uat.md."},{"name":"Dashboards","description":"Dashboard endpoints for comprehensive data visualization - Accounting, Payroll, Performance, and Portfolio Management dashboards with filtering capabilities"},{"name":"Saved filter favorites","description":"User-scoped named filter presets (routeKey + JSON filters) for lists and reports — not tied to a single report definition"},{"name":"Accounting - Short-term investments","description":"Liquid short-term investments (money market, T-bills, CDs): instruments, APY history, accruals, catch-up, settlement, accrual approval, CFO dashboard, month-end unrealized FX. All routes require JWT only (no permission middleware). Try It Out: use server URL that includes the /api prefix (e.g. http://localhost:3009/api) so paths resolve to /api/accounting/short-term-investments/..."},{"name":"Updated performance","description":"BSC **data entry**, **workflow**, **performance contracts**, and **scorecard generate** (persist draft) — see `docs/performance-bsc-data-entry-flow.md` for paths, **example JSON bodies** (incl. contracts), and rules. **Contracts:** **`GET /performance/contracts`** (list all with optional filters: contractType, status, periodYear, periodLabel, subjectUserId, departmentName, skip, take). **`POST /performance/contracts/board|ceo|department|employee`** (annual `periodYear` or exact UTC year bounds; CEO may omit `subjectUserId` to resolve from roles). **Scorecards:** `GET /performance/scorecards/employees-for-generation` (EMPLOYEE contract holders for the period, CEO excluded) and **`POST /performance/scorecards/board/generate`, `…/ceo/generate`, `…/department/{department}/generate`, `…/employee/{employeeId}/generate`** — optional period + **sectionBlendMode** (Board/CEO). JWT only on these routes."},{"name":"Phase two Scorecard Editing","description":"**Phase 2 — qualitative scorecard correction only.** Load and edit **persisted** scorecards for **EMPLOYEE**, **DEPARTMENT** (by name), **CEO**, and **BOARD** (DRAFT or FINAL). **Editable:** `qualitativeEvaluation.personalAttributes` (+ optional `trainingAndDevelopment`) and mandatory **`editReason`**. **Not editable:** goal actuals, targets, raw ratings, matrix rows, or computed numeric scores (system-calculated from progress tracking). PUT examples include the full 10×5 personal-attributes grid and populated `beginningOfCycle`, `endOfCycle`, and `interventions` arrays."},{"name":"Phase two PDF uploads","description":"**Phase 2 — vendor PDF attachments (3.2).** Unified uploads for **quotations** (`VendorQuotation`), **procurement invoices**, and **accounting purchase invoices**. Configure allowed types + max size via **settings**; portal uploads require **`vendorPortalToken`**. Attachments are **optional** on submit; when provided they are validated (type, size, PDF integrity, SHA-256) and fully audited."},{"name":"Forecasting Engine","description":"**Forecasting Engine** — multi-dimensional hypercube scenarios, drivers, DAG compute, variance (Eq. 1–10), version lock/snapshots, GL daily sync, and Phase 2 bridges (Investee dispatch, OPM goal links, Events budget accrual). See `docs/forecasting-engine-backend-requirements.md`."}],"components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","bearerFormat":"JWT"}},"schemas":{"FundFeePolicy":{"type":"object","description":"LP fee/carry policy attached to a Fund. All rate fields are fractions (0.02 = 2%).","properties":{"id":{"type":"string","example":"clx0fundid"},"name":{"type":"string","example":"Sports Growth Fund I"},"managementFeeRate":{"type":"number","nullable":true,"example":0.02},"managementFeeBase":{"type":"string","nullable":true,"enum":["COMMITTED","INVESTED","NAV"],"example":"COMMITTED"},"managementFeeFrequency":{"type":"string","nullable":true,"enum":["MONTHLY","QUARTERLY","SEMI_ANNUAL","ANNUAL"],"example":"QUARTERLY"},"managementFeeStartDate":{"type":"string","nullable":true,"format":"date","example":"2025-01-01"},"carryRate":{"type":"number","nullable":true,"example":0.2},"hurdleRate":{"type":"number","nullable":true,"example":0.08},"hurdleType":{"type":"string","nullable":true,"enum":["NONE","PREFERRED_RETURN"],"example":"PREFERRED_RETURN"},"catchUpRate":{"type":"number","nullable":true,"example":1},"waterfallType":{"type":"string","nullable":true,"enum":["EUROPEAN","AMERICAN"],"example":"EUROPEAN"}}}, :"string","format":"date","example":"2026-05-30"},"source":{"type":"string","enum":["DIVIDEND","EXIT_PROCEEDS","INTEREST","OTHER"],"example":"DIVIDEND"},"grossAmount":{"type":"number","example":250000},"sourceCompanyId":{"type":"string","nullable":true,"description":"Optional FK to the source PortfolioCompany.","example":"cmpxxxxxxxxxxxxxxxxxxxxxxx"},"sourceDividendId":{"type":"string","nullable":true,"description":"Optional FK to the originating PortfolioCompanyDividend (dividend pass-through).","example":"cmdyxxxxxxxxxxxxxxxxxxxxx"},"carryRateOverride":{"type":"number","nullable":true,"description":"Overrides Fund.carryRate for this event (fraction).","example":0.2},"currencyCode":{"type":"string","nullable":true,"description":"Optional ISO code; must match the LP commitment currency.","example":"USD"},"notes":{"type":"string","nullable":true,"example":"FY2025 interim dividend pass-through"}}},"AllocationPaymentRequest":{"type":"object","required":["amount"],"properties":{"amount":{"type":"number","example":25000,"description":"Must be > 0 and ≤ remaining balance for this allocation."},"transactionDate":{"type":"string","nullable":true,"format":"date","example":"2026-04-10"},"cashChartOfAccountId":{"type":"string","nullable":true,"description":"Chart of accounts id for the bank/cash account that received or paid funds. Strongly recommended.","example":"clx0bankglacctid"}}},"ManagementFeePeriodSummary":{"type":"object","properties":{"id":{"type":"string"},"periodStart":{"type":"string","format":"date-time"},"periodEnd":{"type":"string","format":"date-time"},"feeBase":{"type":"string","enum":["COMMITTED","INVESTED","NAV"]},"feeBaseAmount":{"type":"string","example":"110000.00"},"rate":{"type":"string","example":"0.02"},"totalFee":{"type":"string","example":"542.47"},"status":{"type":"string","enum":["ACCRUED","INVOICED","PARTIALLY_PAID","PAID"]},"statusLabel":{"type":"string","example":"Accrued"},"invoicesSentAt":{"type":"string","nullable":true,"format":"date-time"},"journalEntryId":{"type":"string","nullable":true},"currency":{"type":"object","properties":{"code":{"type":"string","example":"USD"},"symbol":{"type":"string","example":"$"}}},"_count":{"type":"object","properties":{"allocations":{"type":"integer","example":3}}}}},"ManagementFeeAllocationLine":{"type":"object","properties":{"id":{"type":"string"},"lpLegalNameSnapshot":{"type":"string"},"commitmentSnapshot":{"type":"string"},"shareOfFee":{"type":"string"},"amountPaid":{"type":"string"},"status":{"type":"string","enum":["PENDING","PARTIALLY_PAID","PAID"]},"statusLabel":{"type":"string"},"client":{"type":"object","properties":{"id":{"type":"string"},"legalName":{"type":"string"},"email":{"type":"string","format":"email"}}},"payments":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"amount":{"type":"string"},"recordedAt":{"type":"string","format":"date-time"}}}}}},"ManagementFeePeriodDetail":{"allOf":[{"$ref":"#/components/schemas/ManagementFeePeriodSummary"},{"type":"object","properties":{"notes":{"type":"string","nullable":true},"fund":{"type":"object","properties":{"name":{"type":"string"}}},"journalEntry":{"type":"object","properties":{"id":{"type":"string"},"referenceNumber":{"type":"string","example":"MGTFEE-cmjfpk-1779093542669"},"transactionDate":{"type":"string","format":"date-time"},"status":{"type":"string","example":"POSTED"},"auditTrailSequenceNumber":{"type":"integer","nullable":true}}},"allocations":{"type":"array","items":{"$ref":"#/components/schemas/ManagementFeeAllocationLine"}},"invoiceDispatch":{"type":"object","description":"Present after POST send-invoices","properties":{"sentCount":{"type":"integer"},"failedCount":{"type":"integer"},"skippedCount":{"type":"integer"}}}}}]},"DistributionSummary":{"type":"object","properties":{"id":{"type":"string"},"distributionDate":{"type":"string","format":"date-time"},"source":{"type":"string","enum":["DIVIDEND","EXIT_PROCEEDS","INTEREST","OTHER"]},"grossAmount":{"type":"string" horized"},"404":{"description":"Not found"}}},"put":{"summary":"Update reporting schedule config — investor","description":"**Audience:** **Investor (fund staff)** — JWT (e.g. admin, fund_manager, investments_manager). Not for investee portal users. Send only fields to change (partial update).","tags":["Financial Reporting"],"security":[{"bearerAuth":[]}],"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"name":{"type":"string","description":"Human-readable label in your admin UI","example":"Quarterly portfolio reporting"},"frequency":{"type":"string","enum":["MONTHLY","QUARTERLY","YEARLY","CUSTOM"],"description":"How the system derives the last **completed** period end before `asOfDate` on each tick. CUSTOM uses `customMonthEnds` (month numbers 1–12; period end = last day of that month)."},"isActive":{"type":"boolean","default":true,"description":"Inactive configs are skipped when the reporting schedule automation job runs."},"autoOpenCalendar":{"type":"boolean","default":true,"description":"**true**: tick may broadcast REQUEST (open calendar) for eligible companies when the open window is reached. **false**: tick only runs AUTO reminder tiers (T−3 / overdue) for periods **already** opened."},"dueDateOffsetDaysAfterPeriodEnd":{"type":"integer","minimum":1,"default":15,"description":"Due date = period end date + this many calendar days (used when auto-opening)."},"openCalendarAfterPeriodEndDays":{"type":"integer","minimum":0,"default":1,"description":"Earliest calendar day the tick may send REQUEST: `asOfDate >= periodEnd + N` calendar days (`N=1` = first day after period closes)."},"defaultAttachmentOptionIds":{"type":"array","description":"Catalog ids — same as **POST** `/portfolio-companies/reporting/requests` `attachmentOptionIds`. Omit to use server default full list when automating REQUEST.","items":{"type":"string","enum":["INCOME_STATEMENT","STATEMENT_OF_FINANCIAL_POSITION","CASH_FLOW_STATEMENT","BANK_STATEMENTS","TAX_COMPLIANCE","MANAGEMENT_ACCOUNTS","BUSINESS_PLAN"]}},"customMonthEnds":{"type":"array","description":"Required when `frequency` is CUSTOM. Each value is a month 1–12.","items":{"type":"integer","minimum":1,"maximum":12},"example":[3,6,9,12]}}},"examples":{"deactivate":{"summary":"Pause automation","value":{"isActive":false}},"adjustTiming":{"summary":"Change due/open offsets","value":{"dueDateOffsetDaysAfterPeriodEnd":20,"openCalendarAfterPeriodEndDays":2}},"switchToRemindersOnly":{"summary":"Stop auto-opening; keep reminders","value":{"autoOpenCalendar":false}}}}}},"responses":{"200":{"description":"Updated"},"400":{"description":"Invalid body"},"401":{"description":"Unauthorized"},"404":{"description":"Not found"}}},"delete":{"summary":"Delete reporting schedule config — investor","description":"**Audience:** **Investor (fund staff)** — JWT (e.g. admin, fund_manager, investments_manager). Not for investee portal users. Hard-remove a config; automation will no longer reference it.","tags":["Financial Reporting"],"security":[{"bearerAuth":[]}],"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Deleted"},"401":{"description":"Unauthorized"},"404":{"description":"Not found"}}}},"/funds/{fundId}/fee-policy":{"get":{"tags":["LP Fees & Distributions"],"summary":"1. Get fund LP fee & carry policy","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. \n\n**Purpose (frontend):** Load the fund’s **fee & carry settings** screen before showing “Accrue management fee” or “Declare distribution”. Use on fund settings tab or a dedicated “LP economics” panel.\n\n**What it does:** Reads persisted columns on the `Fund` record — no side effects. Returns management fee terms (annual rate, what capital the fee is calculated on, billing frequency, start date) and carry/waterfall terms (GP carry %, preferred return hurdle, catch-up, European vs American label).\n\n**Display tips:**\n- Show rates as **percentages in the UI** (API stores fractions: `0.02` → display **2%**).\n- If `managementFeeRate` is `null`, show “Not configured” and disable accrue until **PUT** (endpoint 2).\n- `managementFeeBase`: **COMMITTED** = sum of LP commitments; **INVESTED** = disbursed fund investments; **NAV** = invested minus dividends (proxy).\n- Carry fields can be null until distributions need them.\n\n**When to call:** On fund detail mount, after saving policy (endpoint 2), and before opening accrue/distribution modals.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}}],"responses":{"200":{"description":"`data` = FundFeePolicy — use to populate settings form.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"type":"boolean","example":true},"data":{"$ref":"#/components/schemas/FundFeePolicy"}}}}}},"401":{"description":"Unauthorized"},"404":{"description":"Fund not found"}}},"put":{"tags":["LP Fees & Distributions"],"summary":"2. Create or update fund LP fee & carry policy","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. \n\n**Purpose (frontend):** Save the fund’s **LP fee & carry policy** form (create or update in one request).\n\n**What it does:** Upserts all policy fields on the fund. Does **not** bill LPs or post journals by itself — it only stores defaults used by accrue (4) and declare (9).\n\n**Request body (all optional except validation rules):**\n| Field | UI meaning |\n|-------|------------|\n| `managementFeeRate` | Annual fee as fraction (`0.02` = 2%/year). If set, **`managementFeeBase`** and **`managementFeeFrequency`** are required. |\n| `managementFeeBase` | COMMITTED / INVESTED / NAV — what the fee % applies to. |\n| `managementFeeFrequency` | MONTHLY / QUARTERLY / SEMI_ANNUAL / ANNUAL — informational for ops; accrue still uses explicit `periodStart`/`periodEnd`. |\n| `managementFeeStartDate` | First date fees may apply (ISO date). |\n| `carryRate` | GP share of profits above hurdle (e.g. `0.20` = 20%). |\n| `hurdleRate` + `hurdleType` | If `hurdleType` is `PREFERRED_RETURN`, `hurdleRate` is required. `NONE` = no preferred return slice on declare. |\n| `catchUpRate`, `waterfallType` | Advanced carry labels (stored for reporting; simplified waterfall on declare). |\n| Send `null` on a field to **clear** it. |\n\n**After success:** Replace local policy state with `data` from response; refresh endpoint 1 if you cache separately.\n\n**Typical errors (400):** Missing base/frequency when rate set; missing hurdle rate when preferred return selected.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}}],"requestBody":{"required":true,"description":"All fields optional; validation applies when rate or hurdle rules are set. See schema FundFeePolicyUpsertRequest.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FundFeePolicyUpsertRequest"},"examples":{"twoAndTwenty":{"summary":"Classic \"2 and 20\" with 8% preferred return","value":{"managementFeeRate":0.02,"managementFeeBase":"COMMITTED","managementFeeFrequency":"QUARTERLY","managementFeeStartDate":"2025-01-01","carryRate":0.2,"hurdleRate":0.08,"hurdleType":"PREFERRED_RETURN","catchUpRate":1,"waterfallType":"EUROPEAN"}},"managementFeeOnly":{"summary":"Management fee only (no carry yet)","value":{"managementFeeRate":0.02,"managementFeeBase":"COMMITTED","managementFeeFrequency":"QUARTERLY","managementFeeStartDate":"2026-01-01","hurdleType":"NONE"}}}}}},"responses":{"200":{"description":"`message` e.g. Fund fee policy saved.; `data` = updated policy.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"type":"boolean","example":true},"message":{"type":"string","example":"Fund fee policy saved."},"data":{"$ref":"#/components/schemas/FundFeePolicy"}}}}}},"400":{"description":"Validation error — show `message` in form alert."},"401":{"description":"Unauthorized"}}}},"/funds/{fundId}/management-fees":{"get":{"tags":["LP Fees & Distributions"],"summary":"3. List management fee periods","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. **IDs to keep in app state:** `fundId` (route) → after accrue/declare save `data.id` as `periodId` or `distributionId` → from detail view use `data.allocations[].id` for payment/payout actions. \n\n**Purpose (frontend):** **Management fees list** table for a fund — one row per billed period (quarter, half-year, etc.).\n\n**What it does:** Returns all `management_fee_periods` for `fundId`, sorted **newest `periodEnd` first**. Each row is a summary (totals, status, dates) — not per-LP lines.\n\n**Use `data[]` columns:**\n- `id` → navigate to period detail (endpoint 5) or pass as `periodId`.\n- `periodStart` / `periodEnd` → period label in UI.\n- `totalFee`, `feeBaseAmount`, `rate` → header amounts.\n- `status` + `statusLabel` → badge: **Accrued** → **Invoices Sent** → **Partially Paid** → **Fully Paid** (rollup from LP lines).\n\n**When to call:** Management fees tab load; after accrue (4), send-invoices (6), or payment (7) to refresh the list.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}}],"responses":{"200":{"description":"`data` = array of ManagementFeePeriodSummary — table rows.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"type":"boolean","example":true},"data":{"type":"array","items":{"$ref":"#/components/schemas/ManagementFeePeriodSummary"}}}}}}},"400":{"description":"Fund not found"},"401":{"description":"Unauthorized"}}},"post":{"tags":["LP Fees & Distributions"],"summary":"4. Accrue management fee for one period","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. **IDs to keep in app state:** `fundId` (route) → after accrue/declare save `data.id` as `periodId` or `distributionId` → from detail view use `data.allocations[].id` for payment/payout actions. \n\n**Purpose (frontend):** **“Accrue management fee”** wizard — user picks a date range and confirms; backend calculates LP shares and books the accrual.\n\n**What it does (backend, plain language):**\n1. Resolves fee rate/base from fund policy (or request overrides).\n2. Computes **total fee** = `feeBaseAmount × rate × (days in period / 365)` (2 decimal places).\n3. Splits total **pro-rata by LP commitment** into one `management_fee_allocation` per eligible LP.\n4. Posts an **accrual** journal entry (LP receivable up, management fee income).\n5. Creates period with status **ACCRUED**.\n\n**Request body:**\n| Field | Required | UI |\n|-------|----------|-----|\n| `periodStart`, `periodEnd` | Yes | Date range picker (inclusive billing period). |\n| `transactionDate` | No | GL date; defaults to `periodEnd`. |\n| `feeBase` | No | Override COMMITTED / INVESTED / NAV for this run only. |\n| `rateOverride` | No | Override annual rate (fraction) for this run. |\n| `feeBaseAmountOverride` | No | Manual NAV/base amount when auto calc is wrong. |\n| `notes` | No | Free text on the period. |\n\n**After success (201):** Save `data.id` as `periodId`; redirect to period detail (5) or show success + “Send invoices” CTA.\n\n**Typical errors (400):** Policy not configured; zero fee base; no eligible commitments; mixed LP currencies.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}}],"requestBody":{"required":true,"description":"Billing period and optional overrides. Requires fund policy or rateOverride + fee base.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagementFeeAccrueRequest"},"examples":{"q1FromPolicy":{"summary":"Q1 accrual — uses fund policy rate & base","value":{"periodStart":"2026-01-01","periodEnd":"2026-03-31","transactionDate":"2026-03-31","notes":"Q1 2026 management fee accrual"}},"halfYearOverride":{"summary":"H1 with custom base and rate","value":{"periodStart":"2026-01-01","periodEnd":"2026-06-30","feeBase":"INVESTED","rateOverride":0.015,"feeBaseAmountOverride":12000000,"transactionDate":"2026-06-30","notes":"Mid-year accrual at reduced rate on invested capital"}}}}}},"responses":{"201":{"description":"Created — save `data.id` as periodId; `data` = ManagementFeePeriodDetail with allocations.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"type":"boolean","example":true},"message":{"type":"string","example":"Management fee accrued successfully."},"data":{"$ref":"#/components/schemas/ManagementFeePeriodDetail"}}}}}},"400":{"description":"Policy missing, zero base, no LPs, or currency mismatch."},"401":{"description":"Unauthorized"}}}},"/funds/{fundId}/management-fees/{periodId}":{"get":{"tags":["LP Fees & Distributions"],"summary":"5. Get one management fee period (allocations + payments)","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. **IDs to keep in app state:** `fundId` (route) → after accrue/declare save `data.id` as `periodId` or `distributionId` → from detail view use `data.allocations[].id` for payment/payout actions. \n\n**Purpose (frontend):** **Management fee period detail** — header + table of LPs with amounts owed, paid, and status.\n\n**What it does:** Loads one period with nested `allocations[]`. Each allocation is one LP’s share of the period fee.\n\n**Per allocation (LP row):**\n| Field | UI |\n|-------|-----|\n| `client` / `clientId` | LP name, email (for invoice button enablement). |\n| `shareOfFee` | Amount invoiced to this LP. |\n| `amountPaid` | Sum of payments recorded. |\n| `status` / `statusLabel` | PENDING → PARTIALLY_PAID → PAID. |\n| `payments[]` | Payment history (amount, date, journal link if exposed). |\n| `id` | Use as `allocationId` for endpoint 7. |\n\n**Period header:** `journalEntry` / `journalEntryId` is the **accrual only**. Each LP payment (7) creates a **separate** receipt journal — do not treat period JE as “cash received”.\n\n**Period `status` rollup:** ACCRUED → INVOICED (after send-invoices) → PARTIALLY_PAID → PAID.\n\n**When to call:** Period detail route `/funds/:fundId/management-fees/:periodId`; refresh after invoices (6) or payment (7).","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}},{"name":"periodId","in":"path","required":true,"description":"Management fee period id — `data.id` from POST accrue (4) or `data[].id` from list (3).","schema":{"type":"string","example":"cmpayd4r10007uncgkr6bjtlb"}}],"responses":{"200":{"description":"`data` = ManagementFeePeriodDetail — LP table + payment history.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"type":"boolean","example":true},"data":{"$ref":"#/components/schemas/ManagementFeePeriodDetail"}}}}}},"401":{"description":"Unauthorized"},"404":{"description":"Period not found for this fund"}}}},"/funds/{fundId}/management-fees/{periodId}/send-invoices":{"post":{"tags":["LP Fees & Distributions"],"summary":"6. Email management fee invoices to LPs","description":"**Auth:** `Authorization: Bearer <token>`. Any authenticated user may call these routes. **Response shape:** `{ success: boolean, message?: string, data: … }`. On errors, `success` is `false` and `message` is user-facing (no GL codes or internal hints). **Prerequisites (fund setup):** The fund must have **limited partners** (`Client` records) with **ACTIVE** or **PENDING** `investment_commitment` rows on this fund, all in the **same currency**. Capital calls (money in) are separate — see **Capital Calls**. **IDs to keep in app state:** `fundId` (route) → after accrue/declare save `data.id` as `periodId` or `distributionId` → from detail view use `data.allocations[].id` for payment/payout actions. \n\n**Purpose (frontend):** **“Send invoices”** button on period detail — emails each LP their fee notice.\n\n**What it does:** For each allocation with a valid `client.email`, sends HTML email (company letterhead). On **full** SMTP success: period → **INVOICED**, `invoicesSentAt` set. Response may include `invoiceDispatch` with sent/failed/skipped counts — show a toast or modal summary.\n\n**Request body:** Empty `{}` is fine (no fields).\n\n**UI cautions:**\n- **Not idempotent** — clicking again **re-sends** all emails.\n- Disable button if no allocations have email; show skipped count from dispatch.\n- Partial failure → 400 with message; still refresh detail — some rows may have updated.\n\n**After success:** Refresh period detail (5) and list (3) for new status badges.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}},{"name":"periodId","in":"path","required":true,"description":"Management fee period id — `data.id` from POST accrue (4) or `data[].id` from list (3).","schema":{"type":"string","exa |-------|-----|\n| `amount` | Required. > 0 and ≤ **remaining** = `shareOfFee − amountPaid`. Pre-fill “Pay in full” with remaining. |\n| `transactionDate` | Payment date (defaults to today). |\n| `cashChartOfAccountId` | **Bank account** COA id — show dropdown of bank/cash accounts. Strongly recommended so treasury knows which account received funds. If omitted, server picks env/default bank. |\n\n**After success:** Response `data` is full period detail — replace detail state; refresh list (3).\n\n**Typical errors (400):** Amount over remaining or ≤ 0.","security":[{"bearerAuth":[]}],"parameters":[{"name":"fundId","in":"path","required":true,"description":"Fund primary key (cuid) — from fund list or fund detail route.","schema":{"type":"string","example":"cmjfpk2g0000lktwmt25ni8p8"}},{"name":"periodId","in":"path","required":true,"description":"Management fee period id — `data.id` from POST accrue (4) or `data[].id` from list (3).","schema":{"type":"string","example":"cmpayd4r10007uncgkr6bjtlb"}},{"name":"allocationId","in":"path","required":true,"description":"Management fee allocation id — `data.allocations[].id` from period detail (5). One row per LP.","schema":{"type":"string","example":"cmpayd5kr000auncg27rptxd5"}}],"requestBody":{"required":true,"description":"Payment/payout amount and optional bank account. Use the same schema for management fee receipts (7) and distribution payouts (12).","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AllocationPaymentRequest"},"examples":{"fullPayment":{"summary":"Pay full remaining balance","value":{"amount":49.31,"transactionDate":"2026-04-10"}},"partialWithBank":{"summary":"Partial payment — explicit bank GL","value":{"amount":25,"transactionDate":"2026-04-10","cashChartOfAccountId":"clx0bankglacctid"}}}}}},"responses":{"200":{"description":"`data` = updated ManagementFeePeriodDetail — replace detail view state.","content":{"application/json":{"schema":{"type":"object","properties":{"success":{"typ
